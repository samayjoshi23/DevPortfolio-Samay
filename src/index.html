  <script>
    // Apply the visitor's saved colour scheme before first paint (written by ThemeService).
    (function () {
      var root = document.documentElement;
      root.classList.add('js');
      try {
        var saved = JSON.parse(localStorage.getItem('theme-vars') || 'null');
        if (saved && saved.vars) {
          root.dataset.theme = saved.mode;
          root.style.colorScheme = saved.mode;
          for (var name in saved.vars) root.style.setProperty(name, saved.vars[name]);
        }
      } catch (e) {}
    })();
  </script>

  <app-root></app-root>
</body>
