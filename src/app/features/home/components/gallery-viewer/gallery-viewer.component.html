<dialog #dialog class="viewer" aria-labelledby="viewer-title" (keydown)="onKeydown($event)" (close)="onClosed()">
  @if (caseStudy(); as cs) {
    <div class="flex items-center justify-between gap-4 px-[var(--margin)] py-3">
      <h2 id="viewer-title" class="subtitle">
        {{ cs.title }}<span class="ml-3 text-sm font-normal text-muted">{{ index() + 1 }} / {{ total() }}</span>
      </h2>
      <button type="button" class="btn btn-quiet" (click)="onCloseClick()">Close</button>
    </div>

    <div class="viewer-body">
      <button type="button" class="viewer-nav is-prev" aria-label="Previous screen" (click)="step(-1)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6" /></svg>
      </button>
      <img [src]="image()" [alt]="cs.title + ', screen ' + (index() + 1) + ' of ' + total()" (touchstart)="onTouchStart($event)" (touchend)="onTouchEnd($event)" />
      <button type="button" class="viewer-nav is-next" aria-label="Next screen" (click)="step(1)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6" /></svg>
      </button>
    </div>

    <div class="flex flex-wrap justify-center gap-2 px-[var(--margin)] pt-4 pb-5">
      @for (thumb of cs.images; track thumb; let i = $index) {
        <button type="button" class="thumb w-[72px] flex-none" [attr.aria-current]="i === index()" [attr.aria-label]="'Screen ' + (i + 1)" (click)="onThumbClick(i)">
          <img [src]="thumb" alt="" loading="lazy" />
        </button>
      }
    </div>
  }
</dialog>
