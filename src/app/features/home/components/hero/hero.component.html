<section id="top" aria-labelledby="hero-title">
  <div class="wrap grid grid-cols-12 items-center gap-x-6 gap-y-10 pt-6 pb-8 lg:gap-y-0 lg:pt-12">
    <div class="col-span-12 lg:col-span-7">
      <h1 id="hero-title" class="hero-name load">
        {{ profile.firstName }} <span class="block text-accent">{{ profile.lastName }}</span>
      </h1>
      <p class="load mt-7 text-[length:var(--step-lead)] font-medium tracking-tight" style="--i: 1">{{ profile.role }}</p>
      <p class="load mt-3 max-w-[46ch]" style="--i: 2">{{ profile.pitch }}</p>
      <div class="load mt-8 flex flex-wrap items-center gap-3" style="--i: 3">
        <a class="btn" href="#work">
          View my work
          <svg class="icon-nudge" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
        </a>
        <app-resume-button [url]="profile.resume.url" [size]="profile.resume.size" [updated]="profile.resume.updated" />
      </div>
    </div>

    <div class="hero-media col-span-12 justify-self-end sm:col-span-10 sm:col-start-3 lg:col-span-5 lg:col-start-8">
      <figure class="aspect-[4/5] overflow-hidden rounded-[var(--radius)] bg-surface">
        <img class="load-img h-full w-full object-cover object-[47%_50%]" src="assets/Author/author.jpg" width="1675" height="1117" alt="Samay Joshi smiling, arms crossed, in front of a waterfall" />
      </figure>
      <figure class="hero-screen load" style="--i: 5">
        <img class="h-auto w-full" src="assets/Projects/PillnChill/1.png" width="1673" height="806" alt="Home page of Pill’n Chill, an online pharmacy built by Samay" />
      </figure>
    </div>

    <dl class="col-span-12 mt-2 grid grid-cols-2 gap-x-4 gap-y-7 pt-4 md:grid-cols-4 md:gap-6 lg:mt-20" aria-label="At a glance">
      @for (fact of facts; track fact.label; let i = $index) {
        <div class="load flex flex-col-reverse gap-1" [style.--i]="i + 4">
          <dt class="text-sm text-muted">{{ fact.label }}</dt>
          <dd class="title">{{ fact.value }}</dd>
        </div>
      }
    </dl>
  </div>
</section>
