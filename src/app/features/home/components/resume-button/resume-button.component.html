<a
  class="resume btn btn-quiet h-auto py-2 pr-5 pl-2"
  [class.is-saving]="state() === 'saving'"
  [class.is-done]="state() === 'done'"
  [href]="url()"
  download
  (click)="onDownloadClick()">
  <span class="resume-fill" aria-hidden="true"></span>
  <span class="resume-icon" aria-hidden="true">
    @if (state() === 'done') {
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path class="resume-check" d="M5 12.5l4.5 4.5L19 7.5" /></svg>
    } @else {
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><g class="resume-arrow"><path d="M12 4v11" /><path d="M7.5 10.5 12 15l4.5-4.5" /></g><path d="M5 19h14" /></svg>
    }
  </span>
  <span class="relative flex flex-col text-left leading-tight">
    <span>{{ state() === 'done' ? 'Résumé downloaded' : 'Download résumé' }}</span>
    <span class="text-[13px] font-normal text-muted">PDF · {{ size() }} · {{ updated() }}</span>
  </span>
</a>
<span class="sr-only" aria-live="polite">{{ state() === 'done' ? 'Résumé downloaded' : '' }}</span>
