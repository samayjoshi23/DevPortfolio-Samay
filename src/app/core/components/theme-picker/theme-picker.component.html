<button
  id="theme-picker-button"
  type="button"
  class="icon-btn"
  aria-haspopup="true"
  aria-controls="theme-picker-panel"
  [attr.aria-expanded]="isOpen()"
  aria-label="Colour scheme"
  (click)="onToggleClick()">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.8-.9 1.8-1.9 0-.5-.2-.9-.5-1.3-.3-.4-.5-.8-.5-1.3 0-1 .8-1.8 1.8-1.8H17a4 4 0 0 0 4-4C21 6.4 17 3 12 3Z" />
    <circle cx="7.5" cy="11" r="1.2" fill="currentColor" />
    <circle cx="10.5" cy="7" r="1.2" fill="currentColor" />
    <circle cx="15" cy="7.5" r="1.2" fill="currentColor" />
  </svg>
</button>

@if (isOpen()) {
  <div
    id="theme-picker-panel"
    class="picker-panel absolute right-0 top-[calc(100%+8px)] z-40 w-64 rounded-2xl bg-surface-2 p-4 text-ink"
    role="group"
    aria-label="Colour scheme">
    <p class="text-sm font-semibold">Accent colour</p>
    <div class="mt-3 flex flex-wrap gap-2" role="radiogroup" aria-label="Accent colour">
      @for (accent of theme.accents; track accent.id) {
        <button
          type="button"
          role="radio"
          class="swatch"
          [attr.aria-checked]="theme.accentId() === accent.id"
          [attr.aria-label]="accent.label"
          [title]="accent.label"
          [style.--swatch]="accent[theme.mode()].accent"
          (click)="onAccentClick(accent.id)"></button>
      }
    </div>
    <button type="button" class="mt-4 flex min-h-11 w-full items-center justify-between rounded-xl bg-surface px-4 text-sm font-medium" (click)="onModeClick()">
      <span>{{ theme.mode() === 'dark' ? 'Dark mode' : 'Light mode' }}</span>
      <span class="mode-switch" [class.is-on]="theme.mode() === 'light'" aria-hidden="true"></span>
      <span class="sr-only">, switch to {{ theme.mode() === 'dark' ? 'light' : 'dark' }}</span>
    </button>
  </div>
}
