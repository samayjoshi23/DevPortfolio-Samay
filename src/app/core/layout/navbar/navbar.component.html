<div class="wrap flex min-h-[72px] items-center justify-between gap-4">
  <a href="#top" class="inline-flex min-h-11 items-center gap-2.5 font-semibold tracking-tight whitespace-nowrap no-underline" aria-label="Samay Joshi, back to top">
    <svg class="h-[18px] w-[26px] flex-none text-accent" viewBox="0 0 26 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M9 2 2 9l7 7M17 2l7 7-7 7" />
    </svg>
    Samay Joshi
  </a>

  <nav class="flex items-center gap-1 text-sm font-medium sm:gap-3 lg:gap-6" aria-label="Main">
    <a href="#work" class="inline-flex min-h-11 items-center px-1 text-muted no-underline transition-colors hover:text-ink">Work</a>
    <a href="#about" class="hidden min-h-11 items-center px-1 text-muted no-underline transition-colors hover:text-ink sm:inline-flex">About</a>
    <a href="#experience" class="hidden min-h-11 items-center px-1 text-muted no-underline transition-colors hover:text-ink sm:inline-flex">Experience</a>
    <button type="button" class="icon-btn hidden sm:inline-grid" [attr.aria-label]="theme.mode() === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'" (click)="onModeClick()">
      @if (theme.mode() === 'dark') {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
      } @else {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" /></svg>
      }
    </button>
    <app-theme-picker />
    <a href="#contact" class="btn ml-1">Hire me</a>
  </nav>
</div>
